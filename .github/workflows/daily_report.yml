name: Daily Tongariro Mountain Report

on:
  schedule:
    # Scheduled for 08:37 UTC = 20:37 NZST (NZ winter, UTC+12) the previous
    # day. This looks early, but GitHub Actions has been consistently
    # starting this job ~4 hours late (observed: scheduled 12:37 UTC, actual
    # runs 16:34-16:53 UTC), likely due to `schedule` triggers being
    # deprioritized under load - worse for low-activity repos, and worse
    # around this time since 12:37 UTC lands mid-morning US Eastern, a peak
    # period. Scheduling 4 hours earlier compensates, so the job actually
    # runs around 00:37 NZST (just after midnight) as originally intended.
    # If GitHub's delay pattern changes, re-check actual run times
    # (`gh run list --workflow=daily_report.yml`) and adjust.
    # Offset a few minutes off the hour since GitHub Actions deprioritizes
    # on-the-hour schedules under load, making them more likely to be delayed
    # or skipped.
    # Note: during NZ daylight saving (NZDT, UTC+13, roughly late Sep - early
    # Apr) this instead fires (before the delay) at 21:37 NZDT the previous
    # day. Adjust the cron expression if you need a fixed local time
    # year-round.
    - cron: '37 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    # Worst case: 4 attempts x up to 8 min each, plus 3 waits of 30 min
    # between failed attempts (~32 + 90 min), plus setup steps.
    timeout-minutes: 140
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # main.py already retries individual Gemini API calls a few times
      # with a short backoff (see GEMINI_RETRY_ATTEMPTS in config.py), for
      # quick blips. This outer retry is the safety net for longer outages
      # (e.g. sustained high load / usage limits) that don't clear in
      # seconds: it re-runs the whole script - re-fetching sources and
      # re-querying Gemini - up to 4 times, 30 minutes apart.
      # SUPPRESS_DISCORD_ALERT stops main.py posting its own failure alert
      # on each retried attempt; only a final, all-retries-exhausted
      # failure is reported, by the step below.
      - name: Run daily report
        id: run_report
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 4
          retry_wait_seconds: 1800
          retry_on: any
          command: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPPRESS_DISCORD_ALERT: 'true'

      - name: Alert on repeated failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOTAL_ATTEMPTS: ${{ steps.run_report.outputs.total_attempts }}
        run: |
          message="⚠️ **Tongariro Mountain Report failed after ${TOTAL_ATTEMPTS:-several} attempts.**
          Please check avalanche.net.nz directly, and check the bot logs.
          -# 🤖 Automated alert from the mountain report bot."
          payload=$(jq -n --arg content "$message" '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
